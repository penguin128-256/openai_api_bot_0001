# 日経ビジネス → PDF → OneDrive 設定ファイル
# このファイルを config.toml にコピーして編集してください。

[nikkei]
# 雑誌(紙面)のバックナンバー一覧ページ
magazine_url = "https://business.nikkei.com/magazine/"
# 各号の目次ページへのリンクを見つける正規表現(最初のグループ = 号の通し番号。最大のものを最新号とみなす)
issue_link_pattern = '/atcl/NBD/19/mokuji/(\d+)/'
# 目次ページのうち、その号の記事一覧が入っている部分(おすすめ・ランキング等を除外するため)
toc_selector = ".p-parentArticle"
# セクション名(特集・連載・時事深層など)として使う見出し
section_heading_selector = "h2"
# 目次内の記事リンクを見つける正規表現
article_link_pattern = 'business\.nikkei\.com/atcl/'
# 除外するリンク(目次内のバックナンバー一覧など)
article_exclude_pattern = '/mokuji/'
# 有料記事の続きが読めていないときに表示される要素(ログイン切れの検出用)
paywall_selector = ".p-paywall, [class*='p-paywall']"
# 記事ページの「次ページ」リンクを見つける正規表現(複数ページ記事用)
next_page_pattern = '[?&]P=(\d+)'
# 記事ページから取り出す要素(上から順に並べる。最後は本文で、これが無いページは全体を印刷)
article_selectors = [
  ".p-article_header_parentTitle",
  "h1.p-article_header_title",
  ".p-article_header_meta",
  ".p-article_header_image",
  ".p-article_body",
]
# 取り出した本文から取り除く要素(広告・SNSボタン・続きを読む案内など)
article_remove_selectors = [
  "script", "style", "iframe", "noscript", "button", "form", "input",
  "[class*='adText']",
  "[class*='ad-']", "[class*='Ad_']", "[class*='share']", "[class*='follow']",
  "[class*='banner']", "[class*='recommend']",
]
# (本文が見つからないページ用)PDF化の際に非表示にする要素(ヘッダー・広告・関連記事など)
hide_selectors = [
  "header", "footer", "nav", "aside", "iframe",
  "[class*='ad-']", "[class*='Ad_']", "[id*='ad-']",
  "[class*='recommend']", "[class*='ranking']", "[class*='share']",
  "[class*='follow']", "[class*='banner']", "[class*='paywall']",
]
# ページ読み込み後の待ち時間(ミリ秒)
wait_ms = 1500
# 記事間のアクセス間隔(秒)。サーバーに負荷をかけないよう余裕を持たせてください
request_interval_sec = 3
# 1号あたりの最大記事数(安全装置)
max_articles = 150

[pdf]
# 用紙サイズ: "A4" / "A5" / "B5" など。iPadなら A4 が見やすい
format = "A4"
# 文字の拡大率(1.0 = そのまま)
font_scale = 1.15
margin_mm = 12

[output]
# "folder": OneDriveの同期フォルダに保存(Mac/Windowsで OneDrive アプリを使っている場合。おすすめ)
# "graph" : Microsoft Graph API で直接アップロード(OneDriveアプリがないPC/サーバー用)
mode = "folder"
# mode = "folder" のときの保存先(OneDrive同期フォルダ内)
#   Mac 例:     "~/Library/CloudStorage/OneDrive-Personal/日経ビジネス"
#   Windows 例: "~/OneDrive/日経ビジネス"
folder = "~/OneDrive/日経ビジネス"
# mode = "graph" のときの OneDrive 上の保存フォルダ
graph_folder = "日経ビジネス"
# mode = "graph" のとき: Azure ポータルで登録したアプリの「アプリケーション (クライアント) ID」
graph_client_id = ""
# 個人用Microsoftアカウントなら "consumers"、会社/学校アカウントなら "organizations"
graph_tenant = "consumers"
